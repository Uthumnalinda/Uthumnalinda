name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Push on master/main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Core options
          user: ${{ github.repository_owner }}
          template: terminal
          base: header
          base_activity: no
          base_community: no
          base_repositories: no
          base_metadata: no
          config_timezone: UTC
          
          # Output file name and path
          filename: github-metrics.svg
          
          # 1. Whoami Introduction
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # 2. Most Used Languages (Breakdown & Percentages)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          
          # 3. Coding Habits (Active times & streaks)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          
          # 4. Total Lines of Code (Added / Deleted stats)
          plugin_lines: yes
          
          # 5. Achievements & Badges
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
