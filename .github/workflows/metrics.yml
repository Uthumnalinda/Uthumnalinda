name: Metrics
on:
  # Schedule daily updates at midnight UTC
  schedule: [{cron: "0 0 * * *"}]
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
  # Push on master/main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate Complete Terminal Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          # Core options
          user: ${{ github.repository_owner }}
          template: terminal
          base: header, activity
          base_community: no
          base_repositories: no
          base_metadata: no
          config_timezone: UTC
          
          # Output file name and path
          filename: github-metrics.svg
          
          # 1. whoami (Introduction)
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # 2. locale (Languages breakdown)
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          
          # 3. cal (ASCII Contribution Calendar)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 4. fortune (Developer Quotes & Tips)
          plugin_fortune: yes
