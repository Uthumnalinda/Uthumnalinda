<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .t-green { fill: #00ff66; font-weight: 700; font-size: 15px; }
      .t-white { fill: #f0f6fc; font-weight: 700; font-size: 15px; }
      .t-cyan  { fill: #38bdf8; font-size: 14px; font-weight: 600; }
      .t-text  { fill: #e6edf3; font-size: 14px; }
      .t-dim   { fill: #7d8590; font-size: 13.5px; }
      .t-bar   { fill: #00ff66; }
      .t-bar-bg { fill: #30363d; }

      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .cursor { animation: blink 0.9s infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="800" height="420" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <path d="M0 10C0 4.47715 4.47715 0 10 0H790C795.523 0 800 4.47715 800 10V38H0V10Z" fill="#161b22"/>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1"/>

  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>
  <text x="400" y="24" text-anchor="middle" class="mono" font-size="13" fill="#8b949e" font-weight="600">uthum@terminal: ~ (skills)</text>

  <g class="mono" transform="translate(28, 68)">
    <text x="0" y="0" class="t-dim">Reading technical stack configuration...</text>
    
    <text x="0" y="36">
      <tspan class="t-green">uthum@developer:~$</tspan>
      <tspan class="t-white"> cat skills.json</tspan>
    </text>

    <text x="0" y="72" class="t-white">🛠️ Technical Competencies &amp; Toolkit</text>
    
    <text x="0" y="104">
      <tspan class="t-cyan">▸ Languages    : </tspan>
      <tspan class="t-text">JavaScript, TypeScript, Python, HTML5, CSS3, SQL</tspan>
    </text>
    
    <text x="0" y="132">
      <tspan class="t-cyan">▸ Frontend     : </tspan>
      <tspan class="t-text">React.js, Next.js, TailwindCSS, Vite, Redux</tspan>
    </text>

    <text x="0" y="160">
      <tspan class="t-cyan">▸ Backend      : </tspan>
      <tspan class="t-text">Node.js, Express.js, RESTful APIs, GraphQL</tspan>
    </text>

    <text x="0" y="188">
      <tspan class="t-cyan">▸ Databases    : </tspan>
      <tspan class="t-text">PostgreSQL, MongoDB, MySQL, Redis</tspan>
    </text>

    <text x="0" y="216">
      <tspan class="t-cyan">▸ Cloud/DevOps : </tspan>
      <tspan class="t-text">Docker, Git, GitHub Actions, Linux, AWS</tspan>
    </text>

    <text x="0" y="254" class="t-dim">─────────────────────────────────────────────────────────────────────────────</text>

    <text x="0" y="286">
      <tspan class="t-green">uthum@developer:~$ </tspan>
      <tspan class="t-green cursor">█</tspan>
    </text>
  </g>
</svg>
