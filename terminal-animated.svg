<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" fill="none">
  <defs>
    <style>
      .mono {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      }
      .t-green { fill: #00ff66; font-weight: 700; font-size: 15px; }
      .t-white { fill: #f0f6fc; font-weight: 700; font-size: 15px; }
      .t-cyan  { fill: #38bdf8; font-size: 14.5px; font-weight: 600; }
      .t-yellow{ fill: #fde047; font-size: 14.5px; font-weight: 600; }
      .t-text  { fill: #e6edf3; font-size: 14px; }
      .t-dim   { fill: #7d8590; font-size: 13.5px; }
      .t-bar-g { fill: #00ff66; }
      .t-bar-w { fill: #484f58; }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 0.9s infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="800" height="460" rx="10" ry="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <path d="M0 10C0 4.47715 4.47715 0 10 0H790C795.523 0 800 4.47715 800 10V38H0V10Z" fill="#161b22"/>
  <line x1="0" y1="38" x2="800" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Dots -->
  <circle cx="22" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="19" r="6" fill="#27c93f"/>

  <!-- Title -->
  <text x="400" y="24" text-anchor="middle" class="mono" font-size="13" fill="#8b949e" font-weight="600">uthum@developer-workstation:~ (bash)</text>

  <!-- Content -->
  <g class="mono" transform="translate(28, 68)">
    
    <!-- Header info -->
    <text x="0" y="0" class="t-dim">Welcome to Ubuntu 24.04.1 LTS (GNU/Linux 6.8.0-generic x86_64)</text>
    <text x="0" y="20" class="t-dim">* Documentation:  https://github.com/Uthumnalinda</text>

    <!-- Command: whoami -->
    <text x="0" y="58">
      <tspan class="t-green">uthum@developer:~$</tspan>
      <tspan class="t-white"> whoami</tspan>
    </text>

    <!-- Output of whoami -->
    <text x="0" y="88">
      <tspan class="t-white">Uthum Nalinda</tspan>
      <tspan class="t-dim"> [Full-Stack Developer &amp; Software Engineer]</tspan>
    </text>

    <!-- Details Section -->
    <text x="0" y="118">
      <tspan class="t-cyan">▸ Status      : </tspan>
      <tspan class="t-text">🟢 Open for opportunities &amp; open-source collaboration</tspan>
    </text>

    <text x="0" y="144">
      <tspan class="t-cyan">▸ Languages   : </tspan>
      <tspan class="t-text">JavaScript (ES6+), TypeScript, Python, HTML5, CSS3, SQL</tspan>
    </text>

    <text x="0" y="170">
      <tspan class="t-cyan">▸ Frameworks  : </tspan>
      <tspan class="t-text">React, Next.js, Node.js, Express, TailwindCSS</tspan>
    </text>

    <text x="0" y="196">
      <tspan class="t-cyan">▸ Tools &amp; DB  : </tspan>
      <tspan class="t-text">Git, Docker, PostgreSQL, MongoDB, Linux, VS Code</tspan>
    </text>

    <text x="0" y="222">
      <tspan class="t-cyan">▸ GitHub      : </tspan>
      <tspan class="t-green">https://github.com/Uthumnalinda</tspan>
    </text>

    <!-- Divider -->
    <text x="0" y="254" class="t-dim">─────────────────────────────────────────────────────────────────────────────</text>

    <!-- Second Command: cat stats.txt -->
    <text x="0" y="286">
      <tspan class="t-green">uthum@developer:~$</tspan>
      <tspan class="t-white"> cat stats.txt</tspan>
    </text>

    <text x="0" y="316">
      <tspan class="t-yellow">Repositories  : </tspan>
      <tspan class="t-white">Active Builder  </tspan>
      <tspan class="t-bar-g">■■■■■■■■■■■■</tspan><tspan class="t-bar-w">■■■■</tspan>
    </text>

    <text x="0" y="342">
      <tspan class="t-yellow">Commit Activity: </tspan>
      <tspan class="t-white">Continuous      </tspan>
      <tspan class="t-bar-g">■■■■■■■■■■■■■■</tspan><tspan class="t-bar-w">■■</tspan>
    </text>

    <!-- Active prompt cursor -->
    <text x="0" y="374">
      <tspan class="t-green">uthum@developer:~$ </tspan>
      <tspan class="t-green cursor">█</tspan>
    </text>

  </g>
</svg>
