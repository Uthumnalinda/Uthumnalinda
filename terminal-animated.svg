<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Ubuntu+Mono:wght@400;700&amp;display=swap');

      .terminal-text {
        font-family: 'Fira Code', 'Ubuntu Mono', monospace;
        font-size: 14px;
        fill: #39ff14;
      }

      .text-dim { fill: #008f11; }
      .text-white { fill: #ffffff; }
      .text-cyan { fill: #00f0ff; }
      .text-yellow { fill: #ffe600; }
      .text-prompt { fill: #00ff66; font-weight: 700; }

      /* Typewriter & reveal animations */
      @keyframes typing {
        0%, 15% { width: 0; }
        35%, 100% { width: 75px; }
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes outputReveal {
        0%, 38% { opacity: 0; transform: translateY(6px); }
        45%, 100% { opacity: 1; transform: translateY(0); }
      }

      @keyframes prompt2Reveal {
        0%, 65% { opacity: 0; }
        72%, 100% { opacity: 1; }
      }

      .typed-command {
        display: inline-block;
        overflow: hidden;
        white-space: nowrap;
        animation: typing 6s steps(7, end) infinite;
      }

      .cursor {
        animation: blink 0.8s infinite;
      }

      .command-output {
        animation: outputReveal 6s ease-out infinite;
      }

      .second-prompt {
        animation: prompt2Reveal 6s ease-out infinite;
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="0" y="0" width="700" height="420" rx="12" ry="12" fill="#0c1017" stroke="#1f293d" stroke-width="1.5"/>

  <!-- Title Bar -->
  <path d="M0 12C0 5.37258 5.37258 0 12 0H688C694.627 0 700 5.37258 700 12V36H0V12Z" fill="#161b22"/>
  <line x1="0" y1="36" x2="700" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="6" fill="#27c93f"/>

  <!-- Terminal Title -->
  <text x="350" y="23" text-anchor="middle" font-family="'Fira Code', monospace" font-size="12" fill="#8b949e" font-weight="600">bash — uthumnalinda@developer-terminal:~ (80x24)</text>

  <!-- Terminal Body -->
  <g transform="translate(24, 66)" class="terminal-text">
    <!-- Session Banner -->
    <text x="0" y="0" class="text-dim">Last login: Fri Sep 12 23:25:00 on ttys001</text>
    <text x="0" y="20" class="text-dim">Type 'help' for available commands or click interactive modules below.</text>

    <!-- First Command Line: whoami -->
    <text x="0" y="60" class="text-prompt">uthum@developer:~$ </text>
    
    <!-- Animated typing text -->
    <foreignObject x="185" y="46" width="300" height="25">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Fira Code', monospace; font-size: 14px; color: #ffffff; display: flex; align-items: center;">
        <span class="typed-command">whoami</span>
        <span class="cursor" style="color: #39ff14; font-weight: bold; margin-left: 2px;">█</span>
      </div>
    </foreignObject>

    <!-- Animated Output of whoami -->
    <g class="command-output">
      <!-- User Info Output -->
      <text x="0" y="95" class="text-white" font-weight="bold">Uthum Nalinda (Full Stack Developer &amp; Creator)</text>
      
      <text x="0" y="122" class="text-cyan">▸ Status      : </text>
      <text x="140" y="122" class="text-white">🚀 Crafting innovative software &amp; web apps</text>
      
      <text x="0" y="146" class="text-cyan">▸ Languages   : </text>
      <text x="140" y="146" class="text-white">JavaScript, TypeScript, Python, HTML/CSS, SQL</text>
      
      <text x="0" y="170" class="text-cyan">▸ Tech Stack  : </text>
      <text x="140" y="170" class="text-white">React, Next.js, Node.js, Express, Docker, Git</text>
      
      <text x="0" y="194" class="text-cyan">▸ GitHub Stats: </text>
      <text x="140" y="194" fill="#39ff14">✔ Active Contributor  ✔ Open Source Enthusiast  ✔ Open for Collab</text>

      <text x="0" y="224" class="text-dim">-------------------------------------------------------------</text>
    </g>

    <!-- Next Active Prompt with Blinking Cursor -->
    <g class="second-prompt">
      <text x="0" y="255" class="text-prompt">uthum@developer:~$ </text>
      <foreignObject x="185" y="241" width="300" height="25">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Fira Code', monospace; font-size: 14px; color: #ffffff; display: flex; align-items: center;">
          <span style="color: #ffe600;">cat skills.txt</span>
          <span class="cursor" style="color: #39ff14; font-weight: bold; margin-left: 2px;">_</span>
        </div>
      </foreignObject>
    </g>
  </g>
</svg>
